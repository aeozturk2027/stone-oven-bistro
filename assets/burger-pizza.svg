<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Burger and pizza restaurant counter</title>
  <desc id="desc">A warm restaurant scene with a burger, pizza slices, fries, and drinks on a counter.</desc>
  <defs>
    <linearGradient id="wall" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7d77c"/>
      <stop offset="0.55" stop-color="#fff0bf"/>
      <stop offset="1" stop-color="#f2b15e"/>
    </linearGradient>
    <linearGradient id="counter" x1="0" x2="1">
      <stop offset="0" stop-color="#35221d"/>
      <stop offset="1" stop-color="#7b3d2d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#2b1610" flood-opacity="0.28"/>
    </filter>
  </defs>
